# Absolute allocation; cold startup passed on the ~48 GiB development card.
# Physical 32 GB/R9700 validation remains a separate hardware check.
# The workflow derives the vLLM fraction from the observed single-device capacity.
v:
  model: core12345/ChipMATE-V-4B
  base_url: http://127.0.0.1:8001/v1
p:
  model: core12345/ChipMATE-P-4B
  base_url: http://127.0.0.1:8002/v1
runtime:
  dtype: bfloat16
  max_model_len: 24576
  max_num_seqs: 3
  gpu_memory_budget_bytes_per_service: 14000000000
  total_gpu_memory_limit_bytes: 32000000000
  extra_args: ["--enforce-eager", "--language-model-only", "--no-enable-log-requests"]
  environment:
    HIP_VISIBLE_DEVICES: "0"
